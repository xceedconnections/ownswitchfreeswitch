; Managed by Ownswitch installer (deploy/stages/80_php_nginx.sh)
; Rendered from deploy/templates/php-fpm-pool.conf  ->  /etc/php/@@PHP_VERSION@@/fpm/pool.d/ownswitch.conf

[ownswitch]
user = ownswitch
group = ownswitch

listen = @@PHP_FPM_SOCK@@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = @@PHP_FPM_MAX_CHILDREN@@
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = yes

; Secrets live OUTSIDE the web root. The application loads this file itself
; (root:ownswitch 0640, readable only by the pool user).
env[OWNSWITCH_ENV_FILE] = @@OWN_ETC@@/ownswitch.env
env[APP_ENV] = production

php_admin_value[error_log] = @@OWN_LOG@@/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[date.timezone] = UTC

; Sessions: private directory, hardened cookies (portal is HTTPS only)
php_admin_value[session.save_path] = @@OWN_VAR@@/sessions
php_admin_value[session.name] = OWNSWITCHSESSID
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on

; Confine file access (/proc + / needed for admin host RAM/disk/NIC widgets)
php_admin_value[open_basedir] = @@OWN_OPT@@:@@OWN_ETC@@/ownswitch.env:@@OWN_VAR@@:@@OWN_LOG@@:/usr/local/freeswitch:/usr/share/php:/usr/share/zoneinfo:/tmp:/dev/urandom:/proc:/sys:/
php_admin_value[sys_temp_dir] = @@OWN_VAR@@/tmp
php_admin_value[upload_tmp_dir] = @@OWN_VAR@@/tmp
php_admin_flag[allow_url_include] = off

; Opcache (code is only changed by atomic release switch + FPM reload)
php_admin_flag[opcache.enable] = on
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.max_accelerated_files] = 20000
