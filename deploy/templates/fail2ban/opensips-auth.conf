# Ownswitch — OpenSIPS digest auth failures (REGISTER / INVITE)
# Matches journald lines, e.g.:
#   REGISTER auth failed user=1001 realm=voip.example.com from=1.2.3.4
#   INVITE auth failed user=1001 from=1.2.3.4
#   REGISTER auth failed for 1001@voip... src=1.2.3.4   (legacy)
[Definition]
failregex = ^\s*(?:\S+\s+)*(?:opensips(?:\[\d+\])?:?\s+)?(?:WARNING|WARN|ERR|ERROR|NOTICE|INFO)?:?\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
            ^\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
ignoreregex =
datepattern = {^LN-BEG}
