# Ownswitch — SIP auth failures on FreeSWITCH (and legacy OpenSIPS lines).
# Matches, for example:
#   2026-11-06 16:20:00.123456 99.00% [WARNING] sofia_reg.c:2000 SIP auth failure (REGISTER) on sofia profile 'external' for [user@domain] from ip 1.2.3.4
#   2026-11-06 16:20:00.123456 99.00% [WARNING] sofia_reg.c:1734 Can't find user [user@domain] from 1.2.3.4
#   INVITE auth failed user=1001 from=1.2.3.4
# "SIP auth challenge" is the normal first 401/407 and must not ban anyone.
[Definition]
failregex = ^\s*.*SIP auth failure \([^)]*\) on sofia profile '[^']+' for \[[^\]]*\] from ip <HOST>
            ^\s*.*Can'?t find user \[[^\]]+\] from <HOST>
            ^\s*(?:\S+\s+)*(?:WARNING|WARN|ERR|ERROR|NOTICE|INFO)?:?\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
            ^\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
ignoreregex = SIP auth challenge
datepattern = {^LN-BEG}
