# Managed by Ownswitch installer (deploy/stages/80_php_nginx.sh)
# Rendered from deploy/templates/nginx-ownswitch.conf -> /etc/nginx/sites-available/ownswitch.conf

limit_req_zone $binary_remote_addr zone=ownswitch_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ownswitch_api:10m rate=30r/s;

# ----------------------------------------------------------------------------
# HTTP: ACME challenge + redirect to HTTPS
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name @@OWNSWITCH_DOMAIN@@;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# HTTPS portal
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@OWNSWITCH_DOMAIN@@;
    server_tokens off;

    ssl_certificate     @@TLS_CERT@@;
    ssl_certificate_key @@TLS_KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ownswitch_ssl:10m;
    ssl_session_tickets off;

    @@HSTS_HEADER@@
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    root @@APP_ROOT@@/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;
    client_body_timeout 30s;

    access_log /var/log/nginx/ownswitch.access.log;
    error_log  /var/log/nginx/ownswitch.error.log warn;

    # Never serve dotfiles / VCS / env files (ACME handled on :80)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # PHP files are never executed or served directly - the front controller is the only entry point
    location ~ \.php$ {
        return 404;
    }

    # Internal endpoints must not be reachable through the public vhost
    location ^~ /internal/ {
        return 404;
    }

    # WebRTC dialer. FreeSWITCH listens for plain SIP-over-WS on localhost only.
    # Forward Sec-WebSocket-Protocol (sip) or FreeSWITCH closes the socket immediately.
    location /sip-ws {
        proxy_pass http://127.0.0.1:5066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /login {
        limit_req zone=ownswitch_login burst=10 nodelay;
        try_files /dev/null @app;
    }

    location ^~ /api/ {
        limit_req zone=ownswitch_api burst=60 nodelay;
        try_files /dev/null @app;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS           on;
        fastcgi_pass unix:@@PHP_FPM_SOCK@@;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}

# ----------------------------------------------------------------------------
# Internal listener (127.0.0.1 only): RTPengine recording notifications, health probes
# ----------------------------------------------------------------------------
server {
    listen @@INTERNAL_HTTP_ADDR@@;
    server_name localhost;
    server_tokens off;
    root @@APP_ROOT@@/public;

    allow 127.0.0.1;
    deny all;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /internal/ {
        try_files /dev/null @app_internal;
    }

    location / {
        return 404;
    }

    location @app_internal {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_pass unix:@@PHP_FPM_SOCK@@;
    }
}
